spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres2
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  
  flyway:
    url: jdbc:postgresql://localhost:5432/postgres2
    user: postgres
    password: admin
    locations: classpath:db/migration
  
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      properties:
        max.request.size: 200000000
    consumer:
      properties:
        fetch.max.bytes: 200000000
    
  testcontainers:
    enabled: false
    
application:
  cosmetics:
    enabled: true