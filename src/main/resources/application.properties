# Spring Boot Configuration

# Data source configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres2
spring.datasource.username=postgres2
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Flyway Configuration  
spring.flyway.url=jdbc:postgresql://localhost:5432/postgres2
spring.flyway.user=postgres2
spring.flyway.password=postgres
spring.flyway.locations=classpath:db/migration

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=cart
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Axon Configuration
axon.serializer.general=jackson
axon.axonserver.enabled=false

# Application specific
application.cosmetics.enabled=true
application.cosmetics.import.batch-size=1000
application.cosmetics.import.default-stock=100

# Swagger UI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs